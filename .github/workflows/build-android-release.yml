name: 构建 Android Release

# 作用：在 GitHub 的 runner 上直接编译 simple_live_app 的 release APK，
# 上传为构建产物（Artifacts），并更新一个固定地址的 Release（tag: android-latest）方便手机直接下载安装。

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/workflows/sync-upstream.yml"
  workflow_dispatch:
    inputs:
      flutter_version:
        description: "Flutter 版本（项目 README 要求 3.38）"
        required: false
        default: "3.38.x"
        type: string
      build_universal:
        description: "额外构建通用 APK（一个包适配所有机型）"
        required: false
        type: boolean
        default: true
      publish_release:
        description: "构建成功后更新 Release 页面"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      APP_DIR: simple_live_app
      # 未配置 secret 时使用这里的默认值
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'simple_live_ci' }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'simplelive' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: 签出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 读取应用版本号
        id: version
        run: |
          set -euo pipefail
          LINE=$(grep -m1 '^version:' "$APP_DIR/pubspec.yaml" | sed 's/version:[[:space:]]*//')
          VERSION_NAME="${LINE%%+*}"
          VERSION_CODE="${LINE##*+}"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "版本：$VERSION_NAME ($VERSION_CODE)"

      - name: 设置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version || '3.38.x' }}
          channel: stable
          cache: true

      - name: 准备 release 签名
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KS="$GITHUB_WORKSPACE/android-release.jks"

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "✅ 使用仓库 Secret ANDROID_KEYSTORE_BASE64 中的签名文件"
          else
            keytool -genkeypair -v -keystore "$KS" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=Simple Live CI, OU=CI, O=CI, L=CI, ST=CI, C=CN"
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，本次使用临时生成的签名密钥。APK 可正常安装，但每次构建签名可能变化，覆盖安装前需先卸载旧版本。建议按说明配置固定签名。"
          fi

          cat > "$APP_DIR/android/key.properties" <<EOF
          storeFile=$KS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF

      - name: 拉取依赖
        working-directory: simple_live_app
        run: |
          flutter --version
          flutter pub get

      - name: 编译 APK（分架构）
        working-directory: simple_live_app
        run: flutter build apk --release --split-per-abi

      - name: 编译 APK（通用包）
        if: inputs.build_universal != false
        working-directory: simple_live_app
        run: flutter build apk --release

      - name: 整理产物
        id: dist
        run: |
          set -euo pipefail
          DIST="$GITHUB_WORKSPACE/dist"
          APKS="$APP_DIR/build/app/outputs/flutter-apk"
          V="${{ steps.version.outputs.version_name }}"
          mkdir -p "$DIST"

          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="$APKS/app-${abi}-release.apk"
            [ -f "$src" ] && cp "$src" "$DIST/SimpleLive-${V}-${abi}.apk" || true
          done
          [ -f "$APKS/app-release.apk" ] && cp "$APKS/app-release.apk" "$DIST/SimpleLive-${V}-universal.apk" || true

          if ! ls "$DIST"/*.apk >/dev/null 2>&1; then
            echo "::error::没有找到任何 APK，构建可能失败，请查看上方 flutter build 日志。"
            exit 1
          fi

          ls -lh "$DIST"
          {
            echo "### 构建产物"
            echo ""
            echo "| 文件 | 大小 |"
            echo "| --- | --- |"
            for f in "$DIST"/*.apk; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-${{ steps.version.outputs.version_name }}-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 准备 Release 说明
        if: github.event_name == 'push' || inputs.publish_release != false
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Simple Live Android ${{ steps.version.outputs.version_name }}

          - 版本号：\`${{ steps.version.outputs.version_name }}\`（versionCode \`${{ steps.version.outputs.version_code }}\`）
          - 源码提交：[\`${{ github.sha }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          - 构建时间：$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')
          - 构建记录：[${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ### 下载哪个？

          | 文件 | 适用设备 |
          | --- | --- |
          | \`SimpleLive-${{ steps.version.outputs.version_name }}-arm64-v8a.apk\` | 绝大多数手机（2017 年后的安卓机首选） |
          | \`SimpleLive-${{ steps.version.outputs.version_name }}-armeabi-v7a.apk\` | 老设备 / 32 位设备 |
          | \`SimpleLive-${{ steps.version.outputs.version_name }}-x86_64.apk\` | 模拟器 |
          | \`SimpleLive-${{ steps.version.outputs.version_name }}-universal.apk\` | 不确定机型时选这个（体积较大） |

          > 本包为自签名 release 版，安装前需允许「未知来源应用」。若提示签名冲突或安装失败，请先卸载旧版本。
          EOF

      - name: 更新 Release（android-latest）
        if: github.event_name == 'push' || inputs.publish_release != false
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version_name }}"
          TITLE="Android $V（最新构建）"

          git tag -f android-latest >/dev/null
          git push -f origin refs/tags/android-latest

          if gh release view android-latest >/dev/null 2>&1; then
            # 清掉旧版本号命名的 APK，避免 Release 页面越积越多
            for asset in $(gh release view android-latest --json assets --jq '.assets[].name'); do
              [ -f "dist/$asset" ] || gh release delete-asset android-latest "$asset" -y || true
            done
            gh release upload android-latest dist/*.apk --clobber
            gh release edit android-latest --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create android-latest dist/*.apk \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --verify-tag
          fi

          {
            echo ""
            echo "### 下载"
            echo ""
            echo "Release 页面：https://github.com/${{ github.repository }}/releases/tag/android-latest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 构建完成
        if: always()
        run: echo "job status = ${{ job.status }}"
